[global]
   workgroup = WORKGROUP
   server string = Muvrix Samba Test Server
   server role = standalone server
   server min protocol = SMB2_02
   server max protocol = SMB3_11
   security = user
   map to guest = Bad User
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   smb ports = 445

[media]
   comment = Muvrix Test Media Share
   path = /srv/media
   browseable = yes
   read only = no
   guest ok = no
   valid users = muvrix_smb
   create mask = 0775
   directory mask = 0775

[guest_media]
   comment = Muvrix Guest Share
   path = /srv/guest_media
   browseable = yes
   read only = yes
   guest ok = yes
