server.modules = (
    "mod_access",
    "mod_alias",
    "mod_auth",
    "mod_authn_file",
    "mod_webdav"
)

server.document-root = "/var/www"
server.port = 8080
server.bind = "0.0.0.0"

mimetype.assign = (
    ".mp4" => "video/mp4",
    ".mkv" => "video/x-matroska",
    ".txt" => "text/plain",
    ".lrc" => "text/plain",
    ".srt" => "text/plain"
)

alias.url = ( "/webdav" => "/var/www/webdav" )

$HTTP["url"] =~ "^/webdav" {
    webdav.activate = "enable"
    webdav.is-readonly = "disable"

    auth.backend = "htpasswd"
    auth.backend.htpasswd.userfile = "/etc/lighttpd/htpasswd"
    auth.require = ( "" => (
        "method" => "basic",
        "realm" => "Muvrix WebDAV",
        "require" => "valid-user"
    ) )
}
