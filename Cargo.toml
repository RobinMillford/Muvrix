[workspace]
resolver = "2"
members = [
    "crates/libmpv-sys",
    "crates/muvrix-core",
    "crates/muvrix-player",
    "crates/muvrix-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Muvrix Team"]
license = "LGPL-2.1-or-later"

[workspace.dependencies]
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
pkg-config = "0.3"
libc = "0.2"
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_glow = "0.31.1"
glow = "0.16"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
