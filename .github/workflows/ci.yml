name: Muvrix Cross-Platform CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =========================================================================
  # 1. Linux Ubuntu Job (Native Host Runner)
  # =========================================================================
  linux-ubuntu:
    name: Linux (Ubuntu x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          echo "Host: $(uname -a)"
          echo "Architecture: $(uname -m)"
          rustc --version
          cargo --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install engine build dependencies (Phase 1.4 pinned source build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libavdevice-dev \
            libass-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libvulkan-dev \
            vulkan-headers \
            libdrm-dev \
            libva-dev \
            libasound2-dev \
            libx11-xcb-dev \
            libgl1-mesa-dev \
            python3

      - name: Build pinned libmpv 0.42.0 from upstream tag
        run: |
          sudo mkdir -p /opt/mpv042
          sudo chown "$USER" /opt/mpv042
          MPV_PREFIX=/opt/mpv042 WORKDIR="$RUNNER_TEMP/engine" ./scripts/ci/build-mpv-0.42.sh "$RUNNER_TEMP/engine"
          echo "PKG_CONFIG_PATH=/opt/mpv042/lib64/pkgconfig:/opt/mpv042/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/mpv042/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Verify pinned engine (API 2.6)
        run: |
          pkg-config --modversion mpv
          pkg-config --modversion libplacebo libavcodec libavformat
          pkg-config --cflags --libs mpv
          grep "MPV_CLIENT_API_VERSION" /opt/mpv042/include/mpv/client.h

      - name: Format Check
        run: cargo fmt --check

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Core Path Resolution Test Suite
        run: cargo test -p muvrix-core

      - name: Native Link Smoke Test & Strict ABI Assertion (libmpv C API 2.6)
        run: cargo test -p libmpv-sys --test link_smoke_test -- --nocapture

      # The media fixtures under docs/tests/fixtures/ are not tracked in git
      # (the directory is ignored so user media cannot be committed by
      # accident). Generate the deterministic 3 s 640x360 H.264 + AAC clip here
      # so the real-runtime playback tests below actually decode media instead
      # of skipping. The file must match what those tests assert: 640x360,
      # h264 video, ~3.0 s duration.
      - name: Generate deterministic playback fixture
        run: |
          set -euo pipefail
          mkdir -p docs/tests/fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc=size=640x360:rate=30:duration=3" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 30 \
            -c:a aac -b:a 64k -shortest \
            docs/tests/fixtures/test_video.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height \
            -of default=nw=1 docs/tests/fixtures/test_video.mp4

      # Real libmpv runtime decode: opens the fixture through the actual engine,
      # with software decoding and null outputs so no GPU or driver is needed.
      # This verifies playback initialisation and decode, NOT GPU rendering.
      - name: libmpv Runtime Playback Test (software decode, null outputs)
        run: cargo test -p muvrix-player --test playback_test -- --nocapture --test-threads=1

      - name: Run Test Suite (Headless Runtime)
        run: cargo test --workspace --all-targets

  # =========================================================================
  # 2. Linux Fedora Job (Containerized Distribution Matrix)
  # =========================================================================
  linux-fedora:
    name: Linux (Fedora 45 Container)
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - name: Install engine build dependencies (Phase 1.4 pinned source build)
        run: |
          dnf install -y \
            git \
            gcc \
            meson \
            ninja-build \
            pkgconf-pkg-config \
            python3 \
            ffmpeg-devel \
            libass-devel \
            wayland-devel \
            wayland-protocols-devel \
            libdisplay-info-devel \
            libxkbcommon-devel \
            libX11-devel \
            libXss-devel \
            vulkan-headers \
            vulkan-loader-devel \
            libdrm-devel \
            libva-devel \
            mesa-libGL-devel \
            rust \
            cargo \
            clippy \
            rustfmt

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          echo "Host: $(uname -a)"
          echo "Architecture: $(uname -m)"
          rustc --version
          cargo --version

      - name: Build pinned libmpv 0.42.0 from upstream tag
        run: |
          MPV_PREFIX=/opt/mpv042 WORKDIR=/tmp/engine ./scripts/ci/build-mpv-0.42.sh /tmp/engine
          echo "PKG_CONFIG_PATH=/opt/mpv042/lib64/pkgconfig:/opt/mpv042/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/mpv042/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Verify pinned engine (API 2.6)
        run: |
          pkg-config --modversion mpv
          pkg-config --modversion libplacebo libavcodec libavformat
          grep "MPV_CLIENT_API_VERSION" /opt/mpv042/include/mpv/client.h

      - name: Format Check
        run: cargo fmt --check

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Core Path Resolution Test Suite
        run: cargo test -p muvrix-core

      - name: Native Link Smoke Test & Strict ABI Assertion (libmpv C API 2.6)
        run: cargo test -p libmpv-sys --test link_smoke_test -- --nocapture

      - name: Run Test Suite (Headless Runtime)
        run: cargo test --workspace --all-targets

  # =========================================================================
  # 3. macOS Apple Silicon Job (Native Host Runner)
  # =========================================================================
  macos-apple-silicon:
    name: macOS (Apple Silicon ARM64 - macos-15)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          echo "Host: $(uname -a)"
          echo "Architecture: $(uname -m)"
          rustc --version
          cargo --version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Homebrew dependencies (Phase 1.4)
        run: |
          # Homebrew's `mpv` formula tracks the latest upstream release and
          # cannot be version-pinned to 0.42.0 in the formula itself. The
          # medium-term target is a pinned source build (as for Linux); the
          # immediate guard is the strict 2.6 ABI assertion in the next step,
          # which fails the job if Homebrew ships any other API level.
          brew install --formula mpv pkg-config
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Verify libmpv linkage and record pinned versions
        run: |
          pkg-config --modversion mpv
          pkg-config --cflags --libs mpv
          brew list --versions mpv
          brew info --json=v2 mpv | jq -r '.formulae[0].versions'
          pkg-config --modversion libplacebo libavcodec libavformat || true
          grep "MPV_CLIENT_API_VERSION" /opt/homebrew/include/mpv/client.h || true

      - name: Enforce pinned engine version (fail on drift)
        run: |
          INSTALLED_VERSION=$(brew list --versions mpv | awk '{print $2}')
          echo "Installed mpv version: ${INSTALLED_VERSION}"
          if [ "${INSTALLED_VERSION}" != "0.42.0" ]; then
            echo "::error::Homebrew mpv version is ${INSTALLED_VERSION}, not 0.42.0. The CI contract requires the pinned 0.42.0 engine (see docs/phase-1.4/phase-1.4-engine-baseline-manifest.md)."
            exit 1
          fi

      - name: Format Check
        run: cargo fmt --check

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Core Path Resolution Test Suite
        run: cargo test -p muvrix-core

      - name: Native Link Smoke Test & Strict ABI Assertion (libmpv C API 2.6)
        run: cargo test -p libmpv-sys --test link_smoke_test -- --nocapture

      - name: Run Test Suite (Headless Runtime)
        run: cargo test --workspace --all-targets

  # =========================================================================
  # 4. Windows x86-64 Job (Native Host Runner)
  # =========================================================================
  windows-x86_64:
    name: Windows (MSVC x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          Write-Host "OS: $env:OS"
          Write-Host "Arch: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Rust: $(rustc --version)"
          Write-Host "Cargo: $(cargo --version)"

      - name: Install Rust stable (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up libmpv Windows MSVC Dev Kit
        shell: pwsh
        run: |
          $destDir = "C:\mpv-dev"
          $archivePath = "C:\mpv-dev.7z"
          # Phase 1.4: libmpv 0.42.0 (Client API 2.6) dev kit.
          # shinchiro's daily build dated 2026-11-05 is git-3138fc8eea,
          # which is the upstream v0.42.0 release commit (b0841e8c) plus
          # the single "Update MPV_VERSION" post-release commit. Its
          # headers were verified to declare MPV_CLIENT_API_VERSION 2.6
          # before being pinned below. No shinchiro release asset is built
          # from the exact v0.42.0 tag commit; the deviation is recorded
          # in docs/phase-1.4/phase-1.4-engine-baseline-manifest.md.
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261105/mpv-dev-x86_64-20261105-git-3138fc8eea.7z"
          $expectedSha256 = "f463cc69a7a1610937688b837be9f005cf163c26f2e35e50aec8cc7bde2894b4"

          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Write-Host "Downloading pinned libmpv development archive from $url..."
          Invoke-WebRequest -Uri $url -OutFile $archivePath

          Write-Host "Verifying SHA-256 checksum..."
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA-256 mismatch! Expected: $expectedSha256, Got: $actualSha256"
          }
          Write-Host "SHA-256 checksum verified successfully: $actualSha256"

          Write-Host "Extracting development archive..."
          7z x $archivePath -o"$destDir" -y | Out-Null

          # Verify required development headers and runtime DLL
          $requiredFiles = @(
            "$destDir\include\mpv\client.h",
            "$destDir\include\mpv\render.h",
            "$destDir\include\mpv\render_gl.h",
            "$destDir\include\mpv\render_d3d11.h",
            "$destDir\libmpv-2.dll"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Verification failed: required artifact missing after extraction: $file"
            }
          }

          # Copy verified module definition file (.def) from repository
          $defFile = "$destDir\libmpv-2.def"
          Copy-Item "crates\libmpv-sys\windows\libmpv-2.def" -Destination $defFile
          Write-Host "Staged module definition file: $defFile"

          # Upstream mpv documentation:
          # https://github.com/mpv-player/mpv/blob/master/DOCS/compile-windows.md#linking-libmpv-with-msvc-programs
          # lib /def:libmpv-2.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          Write-Host "Generating genuine MSVC import library (mpv.lib) from exports using Microsoft lib.exe..."
          & lib /def:"$defFile" /name:libmpv-2.dll /out:"$destDir\mpv.lib" /machine:x64
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$destDir\mpv.lib")) {
            throw "Failed to generate MSVC import library (mpv.lib) with lib.exe"
          }
          Write-Host "Verified generation of MSVC import library: $destDir\mpv.lib"

          # Configure environment paths for compiler, MSVC linker, and OS runtime loader
          # Adding $destDir to PATH ensures Windows LoadLibraryExW finds libmpv-2.dll during test runs
          Add-Content -Path $env:GITHUB_PATH -Value "$destDir"
          Add-Content -Path $env:GITHUB_ENV -Value "MPV_DIR=$destDir"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$destDir;$destDir\lib;$env:LIB"

      - name: Format Check
        run: cargo fmt --check

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Native Link Smoke Test & Strict ABI Assertion (libmpv C API 2.6)
        run: cargo test -p libmpv-sys --test link_smoke_test -- --nocapture

      - name: Core Path Resolution Test Suite
        run: cargo test -p muvrix-core

      - name: Run Full Test Suite (Headless Runtime)
        run: cargo test --workspace --all-targets
